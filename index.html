<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome ItzFizz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="track">
    <section id="hero">
      <div class="sun"></div>
      <div class="skyline"></div>

      <h1 id="headline" aria-label="Welcome ItzFizz"></h1>

      <div id="stats">
        <div class="stat"><p><span data-count="58">0</span>%</p><small>Increase in pick up point use</small></div>
        <div class="stat"><p><span data-count="23">0</span>%</p><small>Decrease in customer phone calls</small></div>
        <div class="stat"><p><span data-count="27">0</span>%</p><small>Increase in pick up point use</small></div>
        <div class="stat"><p><span data-count="40">0</span>%</p><small>Decrease in customer phone calls</small></div>
      </div>

      <div class="road"><div class="dashes"></div></div>

      <!-- Original concept car: low wedge, floating canopy, light-bar nose, glow underbody -->
      <div class="car">
        <svg viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wedge concept car">
          <defs>
            <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f4efe6"/><stop offset="1" stop-color="#b9b2c9"/>
            </linearGradient>
            <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#2b3a67"/><stop offset="1" stop-color="#0d1226"/>
            </linearGradient>
            <radialGradient id="glow" cx=".5" cy=".5" r=".5">
              <stop offset="0" stop-color="#ff9d3c" stop-opacity=".75"/><stop offset="1" stop-color="#ff9d3c" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <ellipse cx="290" cy="178" rx="260" ry="14" fill="url(#glow)"/>
          <!-- rear wing -->
          <path d="M22 118 L22 84 L70 84 L92 112 Z" fill="#241b3d"/>
          <!-- body -->
          <path d="M20 146 L34 122 L150 98 L300 58 L404 62 L474 104 L546 126 L552 146 Z" fill="url(#body)"/>
          <!-- canopy -->
          <path d="M168 98 L300 66 L392 68 L438 100 Z" fill="url(#glass)"/>
          <path d="M300 66 L318 100" stroke="#f4efe6" stroke-width="5"/>
          <!-- accent stripe -->
          <path d="M34 128 L520 128" stroke="#ff7a2f" stroke-width="5" stroke-linecap="round"/>
          <!-- nose light bar + tail light -->
          <path d="M486 112 L540 128" stroke="#7ff3ff" stroke-width="7" stroke-linecap="round"/>
          <rect x="24" y="104" width="30" height="7" rx="3" fill="#ff3d5a"/>
          <!-- wheel arches -->
          <circle cx="130" cy="150" r="40" fill="#0d1226"/>
          <circle cx="440" cy="150" r="40" fill="#0d1226"/>
          <!-- wheels -->
          <g class="wheel"><circle cx="130" cy="150" r="32" fill="#1b1f33"/><circle cx="130" cy="150" r="20" fill="#d8d2c4"/>
            <path d="M130 132v36M112 150h36M117 137l26 26M143 137l-26 26" stroke="#1b1f33" stroke-width="4"/><circle cx="130" cy="150" r="5" fill="#ff7a2f"/></g>
          <g class="wheel"><circle cx="440" cy="150" r="32" fill="#1b1f33"/><circle cx="440" cy="150" r="20" fill="#d8d2c4"/>
            <path d="M440 132v36M422 150h36M427 137l26 26M453 137l-26 26" stroke="#1b1f33" stroke-width="4"/><circle cx="440" cy="150" r="5" fill="#ff7a2f"/></g>
        </svg>
      </div>
    </section>
    <div class="spacer"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
